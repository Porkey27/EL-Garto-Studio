# Tests and builds the app for Windows and Linux on every push and pull request.
# Pushing a version tag (for example v0.2.0) also publishes the installers as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: dist:win
            files: |
              dist/*.exe
          - name: Linux
            os: ubuntu-22.04
            dist: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-libc-dev

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Builds the native helpers (MSVC on Windows, cc on Linux), then the installers.
      - name: Build
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: studio-for-elgato-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
