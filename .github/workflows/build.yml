# Tests and builds the app for Windows and Linux on every push and pull request.
# Releases:
#   * every push to main replaces the "Latest build" pre-release (tag `latest`) with fresh installers;
#   * pushing a version tag (for example v0.2.0) publishes a permanent release with that name.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: dist:win
            files: |
              dist/*-windows-setup.exe
              dist/*-windows-portable.zip
          - name: Linux
            os: ubuntu-22.04
            dist: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-libc-dev

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Builds the native helpers (MSVC on Windows, cc on Linux), then the installers.
      - name: Build
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: studio-for-elgato-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --repo "$REPO" --title "$GITHUB_REF_NAME" --generate-notes
          else
            # Replace the rolling pre-release (and its tag) so it always matches the newest commit.
            gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
            gh release create latest out/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease               --title "Latest build (${GITHUB_SHA::7})"               --notes "Built automatically from the newest commit on main ($GITHUB_SHA). Untested between releases: for a known-good version, use a numbered release."
          fi
